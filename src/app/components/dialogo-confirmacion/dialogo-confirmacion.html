<section>
  <h2>Eliminar usuario</h2>

  <p>
    ¿Estás seguro de que querés eliminar a
    <strong>{{ nombreUsuario }}</strong>?
  </p>

  <button
    type="button"
    [disabled]="eliminando"
    (click)="cancelarEliminacion()"
  >
    Cancelar
  </button>

  <button
    type="button"
    [disabled]="eliminando"
    (click)="confirmarEliminacion()"
  >
    @if (eliminando) {
      Eliminando...
    } @else {
      Eliminar
    }
  </button>
</section>
